<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="html-title">AquaPulse — Ecosystem, Pantry, Medicine & Water Log</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Legacy Script Ingestion Pipeline -->
  <script src="aquapulse.config.js"></script>
  <script src="aquapulse.private.js"></script>
  <script>
    // Non-destructive deep-merge of private configuration overrides
    (function() {
      if (!window.AQUAPULSE_PRIVATE_CONFIG) return;
      function deepMerge(target, source) {
        for (const key of Object.keys(source)) {
          if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key]) && 
              target[key] && typeof target[key] === 'object' && !Array.isArray(target[key])) {
            deepMerge(target[key], source[key]);
          } else {
            target[key] = source[key];
          }
        }
        return target;
      }
      if (window.AQUAPULSE_DEFAULT_CONFIG) {
        window.AQUAPULSE_DEFAULT_CONFIG = deepMerge(window.AQUAPULSE_DEFAULT_CONFIG, window.AQUAPULSE_PRIVATE_CONFIG);
      }
    })();
  </script>
  <script src="aquapulse.optimizer.js"></script>
  <script src="aquapulse.intelligence.js"></script>
  <script src="aquapulse.flow.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            aqua: {
              950: '#04131d',
              900: '#082032',
              800: '#0f3148',
              700: '#164666',
              500: '#06b6d4',
              400: '#22d3ee',
              300: '#67e8f9'
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      background: radial-gradient(circle at top right, #0c2b40 0%, #04131d 65%, #020a10 100%);
      color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .glass-card {
      background: rgba(15, 49, 72, 0.45);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(103, 232, 249, 0.16);
    }
    .tank-glass {
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.14) 0%, rgba(6, 182, 212, 0.18) 72%, rgba(15, 23, 42, 0.95) 86%, #090d14 100%);
      box-shadow: inset 0 12px 30px rgba(255,255,255,0.08), 0 12px 35px rgba(0,0,0,0.6);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fade-in {
      animation: fadeIn 0.15s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="app"></div>

  <!-- Modern Overhauled Architecture Mounting with 100% Backward Compatibility -->
  <script type="module">
    import { EventBus } from './src/core/event-bus.js';
    import { AquaPulseStore } from './src/core/store.js';
    import { ConfigManager } from './src/core/config-manager.js';
    import { PluginRegistry } from './src/core/plugin-registry.js';
    import { TelemetryHAL } from './src/telemetry/telemetry-hal.js';
    import { SampleSensorPlugin } from './src/plugins/sample-sensor-plugin.js';
    import { AppShell } from './src/ui/app-shell.js';

    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Initialize EventBus
      const eventBus = new EventBus();

      // 2. Initialize ConfigManager using ingested legacy global config
      const configManager = new ConfigManager({ eventBus });
      let activeConfig = window.AQUAPULSE_DEFAULT_CONFIG || {};

      try {
        const loaded = configManager.loadConfig();
        if (loaded && loaded.tank) {
          activeConfig = loaded;
        }
      } catch (err) {
        console.warn('ConfigManager loaded fallback defaults:', err);
      }

      window.activeConfig = activeConfig;

      // 3. Centralized Reactive Store
      const store = new AquaPulseStore({
        ...activeConfig,
        telemetry: {
          current: {
            temp: 25.6,
            ph: 7.1,
            nh3: 0.0,
            no2: 0.0,
            no3: 15.0,
            gh: 7.0,
            kh: 4.0,
            orpMv: 340,
            flowRateLph: activeConfig?.tank?.filterFlowLph || 1750
          },
          status: 'OPTIMAL'
        }
      }, eventBus);

      // 4. Plugin Registry
      const pluginRegistry = new PluginRegistry();
      pluginRegistry.register(SampleSensorPlugin);

      // 5. Telemetry HAL
      const telemetryHal = new TelemetryHAL({
        store,
        eventBus,
        tankId: activeConfig?.tank?.id || 'tank-255l'
      });

      // 6. Mount AppShell
      const appContainer = document.getElementById('app');
      const appShell = new AppShell({
        store,
        eventBus,
        configManager,
        pluginRegistry,
        telemetryHal
      });
      appShell.mount(appContainer);

      // 7. Backward Compatibility Bridge for Legacy Globals
      window.appShell = appShell;
      window.switchTab = (tab) => appShell.switchTab(tab);
      window.openConfigModal = () => appShell.openConfigModal();
      window.setFlowMode = (mode) => appShell.flowCanvas?.setFlowMode(mode);
      window.toggleFlowHeatmap = () => {
        if (appShell.flowCanvas) {
          appShell.flowCanvas.toggleLayer('heatmap');
        }
      };
      window.startSoakTimer = (food, sec) => appShell.careHub?.startSoakTimer(food, sec);
      window.toggleTask = (t) => appShell.careHub?.toggleTask(t);
      window.toggleSpongeWeek = () => appShell.careHub?.toggleSpongeCup();
      window.exportParamsCSV = () => appShell.paramLogger?.exportCSV();

      window.__AQUAPULSE__ = {
        store,
        eventBus,
        configManager,
        pluginRegistry,
        telemetryHal,
        appShell
      };
    });
  </script>
</body>
</html>
